<div class="card m-3">
  <h5 class="card-header">Connexion</h5>
  <div class="card-body">
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-group">
        <label for="login">Login</label>
        <input
          id="login"
          type="text"
          formControlName="login"
          class="form-control"
          [ngClass]="{ 'is-invalid': submitted && form['login'].errors }"
        />
        @if (submitted && form['login'].errors?.['required']) {
          <div class="invalid-feedback">Le login est obligatoire.</div>
        }
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          class="form-control"
          [ngClass]="{ 'is-invalid': submitted && form['password'].errors }"
        />
        @if (submitted && form['password'].errors?.['required']) {
          <div class="invalid-feedback">Le mot de passe est obligatoire.</div>
        }
      </div>

      @if (errorMessage) {
        <div class="alert alert-danger" role="alert">{{ errorMessage }}</div>
      }
      @if (successMessage) {
        <div class="alert alert-success" role="status">{{ successMessage }}</div>
      }

      <div class="text-center">
        <button class="btn btn-primary mr-1" type="submit" [disabled]="loading">
          {{ loading ? 'Connexion...' : 'Se connecter' }}
        </button>
        <button class="btn btn-secondary" type="button" (click)="onReset()" [disabled]="loading">
          Réinitialiser
        </button>
      </div>
    </form>
  </div>
</div>
